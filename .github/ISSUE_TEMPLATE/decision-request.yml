name: Decision change request
description: Propose a change to a decision another role owns (no silent overrides).
title: "[decision] <what should change>"
labels: ["needs:decision", "status:ready"]
body:
  - type: input
    id: from
    attributes:
      label: Requested by (role / agent)
    validations:
      required: true
  - type: dropdown
    id: owning_role
    attributes:
      label: Role that owns this decision
      options: [strategist, creative-director, engineer, human-owner]
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where the decision is recorded
      placeholder: "projects/travel-lava/STRATEGY.md#platforms"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change and reason
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on other work
    validations:
      required: true
